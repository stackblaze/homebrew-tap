name: Update formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GHCR tag of ghcr.io/stackblaze/stackblaze-cli (e.g. v1.0.0, latest, dev)"
        required: true
        default: latest
  repository_dispatch:
    # Sent by stackblaze/stackblaze-cli's release job:
    #   gh api repos/stackblaze/homebrew-tap/dispatches -f event_type=cli-release -f client_payload[tag]=vX.Y.Z
    types: [cli-release]

concurrency:
  group: update-formula
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^[A-Za-z0-9_.-]{1,128}$'; then
            echo "::error::invalid tag '${INPUT_TAG}'"; exit 1
          fi
          echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
      - run: ./scripts/update-formula.sh "${{ steps.tag.outputs.tag }}"
      - run: git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: Formula/stackblaze.rb

  test:
    needs: generate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: Formula
      # Symlinks this checkout into Homebrew's Taps dir as stackblaze/tap
      # (Homebrew refuses to install formulae that are not in a tap).
      - uses: Homebrew/actions/setup-homebrew@main
      # Homebrew 7+ only loads third-party tap formulae once trusted.
      - run: brew trust --tap stackblaze/tap || true
      - run: brew install --build-from-source stackblaze/tap/stackblaze
      - run: brew test stackblaze/tap/stackblaze
      - run: stackblaze --version && stackblaze --help >/dev/null

  commit:
    needs: [generate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: Formula
      - name: Commit updated formula
        env:
          TAG: ${{ needs.generate.outputs.tag }}
        run: |
          if git diff --quiet -- Formula/stackblaze.rb; then
            echo "Formula already up to date for ${TAG}"; exit 0
          fi
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/stackblaze.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/stackblaze.rb
          git commit -m "stackblaze ${version}" -m "Generated by scripts/update-formula.sh ${TAG}."
          git push origin HEAD:main
